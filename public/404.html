<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Convivo</title>
    <script>
      // GitHub Pages sirve este archivo para cualquier ruta que no sea un
      // archivo físico (ej. /login, /auth/callback) — reescribe la URL en
      // un query param y redirige a la raíz, donde index.html la decodifica
      // y restaura antes de que React Router monte. Técnica estándar:
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // "/Frontend-CloudNative" (project page)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body>
    <!-- Visible solo el instante previo al redirect (o si JS está desactivado).
         Estilos inline: este archivo es passthrough estático de public/, no
         pasa por Vite ni Tailwind. Colores de src/index.css. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #ffffff;
        color: #00201b;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .marca {
        color: #0d9488;
        font-size: 24px;
        font-weight: 700;
      }
      .msg {
        color: #64748b;
        font-size: 14px;
      }
    </style>
    <span class="marca">Convivo</span>
    <p class="msg">Redirigiendo…</p>
  </body>
</html>
