<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Convivo</title>
    <script>
      // GitHub Pages sirve este archivo para cualquier ruta que no sea un
      // archivo físico (ej. /login, /auth/callback) — reescribe la URL en
      // un query param y redirige a la raíz, donde index.html la decodifica
      // y restaura antes de que React Router monte. Técnica estándar:
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // "/Frontend-CloudNative" (project page)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
